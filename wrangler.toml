name = "market-intel-dashboard"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# KV store backing the live admin (/api/kb reads+writes this). Namespace: market-intel-kb
[[kv_namespaces]]
binding = "KB_STORE"
id = "54ba027ceecf4c808c43ce678a6bb82f"

# Cloudflare Workers AI (free tier) for real sentiment + weekly AI summaries.
[ai]
binding = "AI"

# Static assets live in ./public ; serverless proxy lives in ./functions/api/*
# Set secrets in the Cloudflare dashboard (Pages > Settings > Environment variables):
#   FINNHUB_KEY = <your key>
# Local dev:  npx wrangler pages dev
