name = "market-intel-digest"
main = "digest-worker.js"
compatibility_date = "2024-11-01"

# Runs daily at 01:00 UTC (~09:00 Manila). Adjust as needed.
[triggers]
crons = ["0 1 * * *"]

[vars]
# Your deployed Pages URL (no trailing slash):
DIGEST_TARGET = "https://market-intel-dashboard.pages.dev"
# Comma-separated entity ids to watch (from knowledge-base.json):
WATCHLIST_IDS = "jfc,mlbb,bloomberry,gcash"

# The digest is POSTed to DIGEST_WEBHOOK, which must be set on the PAGES project
# (Pages > Settings > Environment variables), e.g. a Slack or Discord incoming webhook.
